name: Giữ server không ngủ

# Render gói miễn phí tự ngủ sau khoảng 15 phút không có truy cập. Workflow này gọi /api/health
# mỗi 10 phút để server luôn thức, nhờ đó việc dọn tệp hết hạn chạy đúng lịch.
# Chủ nhật (giờ Việt Nam) workflow tự nghỉ khi chạy theo lịch; vẫn chạy được khi bấm Run workflow thủ công.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/health
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(TZ=Asia/Ho_Chi_Minh date +%u)" = "7" ]; then
            echo "Chủ nhật (giờ VN): bỏ qua lượt đánh thức theo lịch."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$APP_URL/api/health" || echo 000)
            echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
        env:
          APP_URL: https://eduscan-28hk.onrender.com
          GITHUB_EVENT_NAME: ${{ github.event_name }}
